name: Loop source checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libsqlite3-dev unzip python3 musl
      - name: Install hash-checked Bun
        run: |
          python3 product/loop/open-source/fetch-dependencies.py --group bun
          mkdir -p "$RUNNER_TEMP/loop-bun"
          unzip -q product/loop/vendor-artifacts/bun-linux-x64-musl-1.3.14.zip -d "$RUNNER_TEMP/loop-bun"
          echo "$RUNNER_TEMP/loop-bun/bun-linux-x64-musl" >> "$GITHUB_PATH"
      - name: Check source without lab credentials
        run: bash product/loop/open-source/check.sh
      - name: Verify source image recipes without publishing
        run: |
          python3 product/loop/open-source/fetch-dependencies.py --group all
          docker build -f product/loop/Dockerfile -t loop-source:ci .
          docker build --build-arg TEST_TARGET=test-source -f voice/c-runtime/Dockerfile -t loop-voice-source:ci .
